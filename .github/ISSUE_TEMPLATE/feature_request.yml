name: Feature request
description: Suggest an idea or improvement for this project
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before investing time in an implementation, please open this issue and let us discuss it —
        it's the fastest way to find out whether a change is likely to be merged. See
        [CONTRIBUTING.md](https://github.com/touchlab/.github/blob/main/CONTRIBUTING.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and discussions (including closed ones) and didn't find this request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the situation you're in rather than jumping straight to the solution. What are you
        trying to do, and what makes it hard or impossible today?
      placeholder: I want to ... but currently I have to ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >
        What would you like to see? API sketches, usage examples, or a rough description are all
        fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Other approaches you've thought about or tried, including workarounds you're using now, and
        why they fall short.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: >
        Links to related issues or discussions, prior art in other libraries, screenshots — anything
        that helps us understand the request.
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: Would you be willing to work on this?
      description: >
        Entirely optional, and saying no won't affect whether we take the request.
      options:
        - "Yes, I'd like to open a pull request"
        - "Maybe, with some guidance"
        - "No, I'm just suggesting the idea"
    validations:
      required: false
