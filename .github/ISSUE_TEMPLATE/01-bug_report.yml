name: Bug report
description: Report something that isn't working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. The more of this you can fill in, the faster we can act on it. If you're not sure whether this is a bug or a usage question, ask in the [#touchlab-tools](https://kotlinlang.slack.com/archives/CTJB58X7X) channel of the Kotlin Community Slack first.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues (including closed ones) and didn't find this one.
          required: true
        - label: I'm using a currently released version of this project.
          required: false
  
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of this project are you using?
      placeholder: "1.2.3"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What goes wrong, in a sentence or two. A crash, a warning, incorrect output, etc.
      placeholder: Calling foo() on iOS throws instead of returning null.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: >
        How can we make this happen on our machines? A link to a minimal sample project is the
        single most useful thing you can give us.
      placeholder: |
        1. Configure the library with ...
        2. Call ...
        3. Observe ...

        Sample project: https://github.com/...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots, Logs, stack traces, or build output
      description: >
        Paste the error message and stack trace if there is one. For build failures, output from a
        run with stack traces enabled is much more useful than the summary line.
      render: text
    validations:
      required: false
