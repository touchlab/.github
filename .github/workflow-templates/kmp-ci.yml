name: KMP CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Run Linting, Shared Build, and JVM/Android Tests on cheaper Linux runners
  lint-and-test:
    name: Lint & Test Shared Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Ktlint and Detekt
        # Assumes you have ktlint and detekt plugins configured in your build.gradle.kts
        run: ./gradlew ktlintCheck detekt --no-daemon

      - name: Build and Test Shared Project
        # This will build the JVM/Android targets and run their tests
        run: ./gradlew build test --no-daemon

  # JOB 2: Build the iOS App on macOS (only runs if Job 1 passes)
  build-ios:
    name: Build iOS Project
    runs-on: macos-latest
    needs: lint-and-test # Prevents this job from running if lint/tests fail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode version
        # Ensures the runner uses a stable, default Xcode installation
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build KMP iOS Framework
        run: ./gradlew assembleIosSimulatorArm64 --no-daemon

      - name: Run tests
        run: ./gradlew :shared:iosX64Test

      - name: Build iOS App
        uses: sersoft-gmbh/xcodebuild-action@v1
        with:
          project: ios/KaMPKitiOS.xcodeproj
          scheme: KaMPKitiOS
          sdk: iphoneos
          configuration: Debug
          action: build
          use-xcpretty: false
          build-settings: CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO